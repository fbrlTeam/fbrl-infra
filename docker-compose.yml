# 출처: farmer0010/fbrl-backend (2026-08-16 기준) — 백엔드 레포 업데이트되면 이 파일도 동기화 필요
services:
  postgres:
    image: postgres:16
    container_name: fbrl-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fbrl_db
      POSTGRES_USER: fbrl_user
      POSTGRES_PASSWORD: fbrlpassword
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  postgres-demo:
    image: postgres:16
    container_name: fbrl-postgres-demo
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fbrl_demo_db
      POSTGRES_USER: fbrl_demo_user
      POSTGRES_PASSWORD: fbrldemopassword
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_demo_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: fbrl-redis
    ports:
      - "6379:6379"
    restart: always

  kafka:
    image: apache/kafka:3.9.0
    container_name: fbrl-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://:9092,CONTROLLER://:9093,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: always

  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: fbrl-kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: fbrl-connect-cluster
      CONFIG_STORAGE_TOPIC: fbrl_connect_configs
      OFFSET_STORAGE_TOPIC: fbrl_connect_offsets
      STATUS_STORAGE_TOPIC: fbrl_connect_statuses
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_started
    restart: always

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: fbrl-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    restart: always

volumes:
  postgres_data:
  postgres_demo_data:
  kafka_data: