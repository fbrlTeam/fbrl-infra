# 템플릿 파일 — 그대로 apply하지 않는다.
# 운영/데모 Postgres가 지금은 같은 관리자 계정(fbrlpgadmin)과 같은 비밀번호를
# 공유하고 있어서(terraform/variables.tf의 postgres_admin_username/password가
# 두 서버에 공통으로 쓰임) 키 하나로 관리한다. 나중에 서버별로 계정을 분리하면
# 키를 postgres-main-password / postgres-demo-password로 나누면 된다.
#
# 실제 값은 이 파일에 넣지 않고, 배포 시점에 다음과 같이 imperative하게 생성한다
# (터미널에 값이 찍히지 않도록 주의):
#
#   kubectl create secret generic kafka-connect-postgres-secret \
#     --from-literal=postgres-password='<terraform.tfvars의 postgres_admin_password 값>'
#
apiVersion: v1
kind: Secret
metadata:
  name: kafka-connect-postgres-secret
type: Opaque
stringData:
  postgres-password: "REPLACE_ME_DO_NOT_COMMIT_REAL_VALUE"
