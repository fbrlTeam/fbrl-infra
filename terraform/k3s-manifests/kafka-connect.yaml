# docker-compose.yml의 kafka-connect 서비스를 K8s Deployment + Service로 옮긴 것.
# 원본의 depends_on(postgres)은 뺐다 — Postgres는 이제 Azure 관리형이라 이 클러스터
# 밖에 있고, k3s에는 올리지 않는다(카프카만 올림).
# database.password 같은 민감정보는 이 매니페스트에 없다 — 별도 Secret으로 관리하고,
# Debezium 커넥터 등록 시점(REST API 호출)에만 그 Secret에서 값을 읽어와 채운다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  labels:
    app: kafka-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      # docker-compose의 depends_on(kafka: condition: service_healthy)에 대응 —
      # kafka Service의 9092 포트가 열릴 때까지 대기한 뒤에 기동한다.
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kafka 9092; do
                echo "waiting for kafka..."
                sleep 5
              done
      containers:
        - name: kafka-connect
          image: debezium/connect:3.0.0.Final
          ports:
            - containerPort: 8083
              name: rest-api
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka:19092"
            - name: GROUP_ID
              value: "fbrl-connect-cluster"
            - name: CONFIG_STORAGE_TOPIC
              value: "fbrl_connect_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "fbrl_connect_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "fbrl_connect_statuses"
          readinessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8083
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  labels:
    app: kafka-connect
spec:
  selector:
    app: kafka-connect
  ports:
    - name: rest-api
      port: 8083
      targetPort: 8083
